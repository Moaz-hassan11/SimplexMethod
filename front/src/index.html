<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Simplex Solver — Linear Programming</title>
  <meta name="description" content="Solve Linear Programming problems using the Simplex Method. Enter your objective function and constraints to get step-by-step solutions.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- ============================================================
       GOOGLE FONTS
       ============================================================
       We load two fonts:
       - Inter        : Clean modern sans-serif for UI text
       - JetBrains Mono: Monospace font for numbers & tableau data
       The "display=swap" ensures text shows immediately in a
       fallback font, then swaps when the custom font loads.
  ============================================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ============================================================
       <app-root> is Angular's entry point.
       Angular looks for a component with selector: 'app-root'
       (that's our App component in app.ts) and renders it here.
       Everything inside <app-root> is just a loading placeholder
       that disappears once Angular bootstraps.
  ============================================================ -->
  <app-root></app-root>
</body>
</html>
